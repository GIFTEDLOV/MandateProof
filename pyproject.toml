[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mandateproof"
version = "1.0.0"
description = "A GenLayer Intelligent Contract for mandate-compliance adjudication"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "direct: direct GenLayer VM tests",
  "adversarial: adversarial security tests",
  "property: invariant/property tests",
  "mutation: mutation-killing tests",
  "semantic: controlled semantic fixtures",
]
