name: exact-head-ci

on:
  push:
  pull_request:

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile contract
        run: python -m compileall -q contracts
      - name: Verify mutation catalog
        run: python -m pytest -q tests/mutation/test_mutation_catalog.py
