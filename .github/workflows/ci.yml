name: exact-head-ci

on:
  push:
  pull_request:

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt genvm-linter==0.11.0
      - name: Compile contract
        run: python -m compileall -q contracts
      - name: Run all 28 direct cases
        run: python scripts/run_direct_tests.py --suite all
      - name: Run direct lifecycle suite
        run: python scripts/run_direct_tests.py --suite direct
      - name: Run adversarial suite
        run: python scripts/run_direct_tests.py --suite adversarial
      - name: Run property suite
        run: python scripts/run_direct_tests.py --suite property
      - name: Run semantic suite
        run: python scripts/run_direct_tests.py --suite semantic
      - name: Run executable mutation suite
        run: python scripts/run_mutations.py
      - name: Run compatible GenVM linter gates
        run: python scripts/run_linter_gate.py
      - name: Verify release identity and provenance
        run: python scripts/verify_release.py
